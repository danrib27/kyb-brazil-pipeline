services:
  db:
    image: postgres:18
    container_name: kybr-db-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - db_network

  adminer:
    image: adminer
    container_name: kybr-adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - db_network

networks:
  db_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
