services:
  db:
    image: postgres:18
    container_name: kybr-db-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - db-network

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - db-network
      - airflow-network

networks:
  db-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
