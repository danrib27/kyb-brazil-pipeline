[project]
name = "kybr-pipeline"
version = "0.1.0"
description = "Know-Your-Business Pipeline for Brazil."
readme = "README.md"
authors = [
    { name = "Daniel Duarte", email = "danielduarte.tech@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.123",
    "humanfriendly>=10.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
kybr-pipeline = "kybr_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
