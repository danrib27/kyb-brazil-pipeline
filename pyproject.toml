[project]
name = "kybr-pipeline"
version = "0.1.0"
description = "Know-Your-Business Pipeline for Brazil."
readme = "README.md"
authors = [
    { name = "Daniel Duarte", email = "danielduarte.tech@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.123",
    "humanfriendly>=10.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
kybr-pipeline = "kybr_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "types-boto3[s3]>=1.43.123",
    "types-humanfriendly>=10.0.1.20250319",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ANN",  # flake8-annotations
    "DTZ",  # flake8-datetimez
    "S",    # flake8-bandit
    "PT",   # flake8-pytest-style
    "TRY",  # tryceratops
    "PERF", # Perflint
    "RUF",  # Ruff-specific rules
]
ignore = [
    "D100", # docstring in public module
    "D104", # docstring in public package
    "D107", # docstring in __init__ (documented in the class docstring)
    "TRY003", # long messages in built-in exceptions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]
